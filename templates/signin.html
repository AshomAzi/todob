{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskCore - Sign In</title>
    <link rel="stylesheet" href="{% static 'css/signin.css' %}">
</head>

<body>

    <header>
        <div class="nav-container">
            <a href="{% url 'home' %}" class="logo">TaskCore.</a>
            <nav class="nav-links">
                <a href="{% url 'signup' %}">Need an account? Create one</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="auth-card">
            <h1>Sign In</h1>
            <p class="subtitle">Access your task dashboard</p>

            <form action="{% url 'signin' %}" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="{% url 'signup' %}">Create one</a>
            </div>
            <div class="error" style="color: red;">
                {% for message in messages %}
                {{ message }}
                {% endfor %}
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 TaskCore. All Rights Reserver.
    </footer>

</body>

</html>
